[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "charge-toggle"
dynamic = ["version"]
description = "Pause battery charging while a Linux laptop runs on its charger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriele Di Antonio", email = "88967511+gdianto@users.noreply.github.com" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest", "ruff"]

[project.scripts]
charge-toggle = "charge_toggle.cli:main"

[project.urls]
Homepage = "https://github.com/gdianto/charge-toggle"

[tool.hatch.version]
path = "src/charge_toggle/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; long strings and test tables may run over

[tool.pytest.ini_options]
testpaths = ["tests"]
